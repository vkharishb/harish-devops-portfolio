name: Portfolio CI

on:
  push:
    branches:
      - main
      - devOps

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # ----------------------------------------
  # Build & Validate
  # ----------------------------------------
  build:
    name: Build & Validate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        run: npx tsc -b

      - name: Production build
        run: npm run build


  # ----------------------------------------
  # Secret Scanning
  # ----------------------------------------
  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2


  # ----------------------------------------
  # SAST
  # ----------------------------------------
  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/javascript


  # ----------------------------------------
  # Dependency Security
  # ----------------------------------------
  dependency-scan:
    name: Dependency Security
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high